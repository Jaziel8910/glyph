[package]
name = "glyph"
version = "0.0.0"
edition = "2021"
description = "Glyph: agent-facing glyph CLI (F0 - seed engine + store)"

[lib]
name = "glyph"
path = "src/lib.rs"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
hkdf = "0.12"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
